services:
  mongo:
    image: mongo:6-jammy
    container_name: complytrack-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ct-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: complytrack-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    networks:
      - ct-net
    expose:
      - 5000

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: complytrack-client
    restart: unless-stopped
    networks:
      - ct-net
    expose:
      - 80

  website:
    image: nginx:alpine
    container_name: complytrack-website
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    networks:
      - ct-net
    expose:
      - 80

  proxy:
    image: nginx:alpine
    container_name: complytrack-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - website
      - server
      - client
    networks:
      - ct-net

volumes:
  mongo_data:

networks:
  ct-net:
    driver: bridge
